name: Build TUBOL Merger Pro

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npx electron-builder --win --publish never
        env:
          CI: "false"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: TUBOL-Merger-Pro-Windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npx electron-builder --mac --publish never
        env:
          CI: "false"

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: TUBOL-Merger-Pro-macOS
          path: dist/*
          if-no-files-found: error
