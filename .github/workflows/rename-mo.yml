name: Rename Merge Navigation

on: push

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename label and remove workflow
        run: |
          if grep -q 'Merge & Organize' index.html; then
            sed -i 's/title="Merge & Organize"/title="M\&O"/g; s#<span class="nav-label">Merge & Organize</span>#<span class="nav-label">M\&O</span>#g' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git rm .github/workflows/rename-mo.yml
            git commit -m 'Rename Merge & Organize navigation to M&O'
            git push
          fi
