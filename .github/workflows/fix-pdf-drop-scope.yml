name: Scope PDF drop to M&O
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restrict PDF drop to M&O
        run: |
          python3 - <<'PY'
from pathlib import Path
p = Path('functions.js')
s = p.read_text(encoding='utf-8')
start = s.index('function setupGlobalPdfDrop()')
end = s.index('\n}\n\nfunction setupEditor()', start) + 2
block = s[start:end]
needle = "    if (!hasFiles(e)) return;"
replacement = needle + "\n    if (!$('#mergeView')?.classList.contains('active-view')) return;"
block = block.replace(needle, replacement)
s = s[:start] + block + s[end:]
p.write_text(s, encoding='utf-8')
PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.js
          git rm .github/workflows/fix-pdf-drop-scope.yml
          git commit -m 'Scope PDF drop to M&O only'
          git push
